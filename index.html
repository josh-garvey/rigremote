<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RigRemote</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #111; color: #eee;
      font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  #bar { display: flex; gap: 10px; align-items: center; }
  #connect { flex: 0 0 auto; padding: 12px 18px; font-size: 16px; border: 0;
      border-radius: 10px; background: #444; color: #fff; }
  #pin { width: 5.5em; padding: 12px; font-size: 16px; border: 0; border-radius: 10px;
      background: #222; color: #fff; text-align: center; -webkit-user-select: text; user-select: text; }
  #status { flex: 1; font-size: 15px; }
  .hold { flex: 1; border: 0; border-radius: 18px; font-size: 34px; font-weight: 700;
      color: #fff; touch-action: none; opacity: .9; }
  .hold:disabled { opacity: .25; }
  .hold.active { opacity: 1; outline: 6px solid #fff; }
  #up { background: #1565c0; }
  #down { background: #2e7d32; }
  #estop { background: #c62828; flex: 1.2; }
  #reset { padding: 14px; font-size: 16px; border: 0; border-radius: 10px;
      background: #333; color: #fff; touch-action: none; }
  #reset.active { background: #777; }
  .latched #status { color: #ff5252; font-weight: 700; }
</style>
</head>
<body>
  <div id="bar">
    <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" autocomplete="off">
    <button id="connect">Connect</button>
    <div id="status">Not connected</div>
  </div>
  <button class="hold" id="up" data-cmd="1" disabled>UP</button>
  <button class="hold" id="down" data-cmd="2" disabled>DOWN</button>
  <button class="hold" id="estop" data-cmd="3" disabled>E-STOP</button>
  <button id="reset" data-cmd="4" disabled>Hold 5 s to reset E-stop</button>

<script>
const SVC    = "6e7a0001-5b1d-4c3e-9a51-3f2b8c1d0a01";
const CMD    = "6e7a0002-5b1d-4c3e-9a51-3f2b8c1d0a01";
const STATUS = "6e7a0003-5b1d-4c3e-9a51-3f2b8c1d0a01";
const NAMES  = ["Connected - idle", "UP running", "DOWN running", "E-STOP LATCHED", "Wrong PIN"];

const $ = id => document.getElementById(id);
const holdBtns = [...document.querySelectorAll("[data-cmd]")];
let device, cmdChar, timer, busy = false, pinBytes = [], badPin = false;
let current = 0, activePointer = null, activeBtn = null;

function setStatus(t) { $("status").textContent = t; }
function enable(on) { holdBtns.forEach(b => b.disabled = !on); }

async function send() {
  if (!cmdChar || busy) return;
  busy = true;
  const data = new Uint8Array([current, ...pinBytes]);
  try {
    if (cmdChar.writeValueWithoutResponse) await cmdChar.writeValueWithoutResponse(data);
    else await cmdChar.writeValue(data);
  } catch (e) { /* Pi watchdog covers dropped packets */ }
  busy = false;
}

function onStatus(v) {
  const s = v.getUint8(0);
  if (s === 4 && cmdChar) {            // Pi rejected our PIN
    badPin = true;
    device.gatt.disconnect();
    return;
  }
  setStatus(NAMES[s] || "?");
  document.body.classList.toggle("latched", s === 3);
}

async function connect() {
  if (!navigator.bluetooth) {
    setStatus("No Web Bluetooth here. Android: use Chrome. iPhone: use Bluefy.");
    return;
  }
  const pin = $("pin").value.trim();
  if (!/^\d{4}$/.test(pin)) { setStatus("Enter the 4-digit PIN first"); return; }
  pinBytes = [...pin].map(c => c.charCodeAt(0));
  badPin = false;
  try {
    setStatus("Searching...");
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SVC] }, { name: "RigRemote" }],
      optionalServices: [SVC],
    });
    device.addEventListener("gattserverdisconnected", onDisconnect);
    setStatus("Connecting...");
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    cmdChar = await svc.getCharacteristic(CMD);
    const st = await svc.getCharacteristic(STATUS);
    st.addEventListener("characteristicvaluechanged", e => onStatus(e.target.value));
    await st.startNotifications();
    await send();                          // first packet carries the PIN
    await new Promise(r => setTimeout(r, 200));
    onStatus(await st.readValue());
    enable(true);
    $("connect").textContent = "Disconnect";
    timer = setInterval(send, 100);          // heartbeat
  } catch (e) {
    setStatus("Failed: " + e.message);
  }
}

function onDisconnect() {
  clearInterval(timer);
  cmdChar = null; release();
  enable(false);
  $("connect").textContent = "Connect";
  document.body.classList.remove("latched");
  setStatus(badPin ? "Wrong PIN - disconnected" : "Disconnected");
}

$("connect").onclick = () => {
  if (device && device.gatt.connected) device.gatt.disconnect();
  else connect();
};

function press(e) {
  e.preventDefault();
  if (activePointer !== null || e.currentTarget.disabled) return;  // one button at a time
  activePointer = e.pointerId;
  activeBtn = e.currentTarget;
  activeBtn.classList.add("active");
  current = +activeBtn.dataset.cmd;
  send();
}
function release(e) {
  if (e && e.pointerId !== activePointer) return;
  if (activeBtn) activeBtn.classList.remove("active");
  activePointer = null; activeBtn = null;
  current = 0;
  send();
}

holdBtns.forEach(b => {
  b.addEventListener("pointerdown", press);
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => b.addEventListener(ev, release));
  b.addEventListener("contextmenu", e => e.preventDefault());
});
// app backgrounded / screen off -> stop
document.addEventListener("visibilitychange", () => { if (document.hidden) release(); });
window.addEventListener("blur", () => release());
</script>
</body>
</html>
